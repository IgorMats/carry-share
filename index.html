<style>

<main id="app"><p class="empty">Loading…</p></main>
<script>
// Position details for the carry Telegram notifier: a closed position, or an
// open position snapshot sent with the opening card (version 2 with st:'o').
// The summary travels in the direct link's startapp parameter, which Telegram
// hands to the page as start_param (and as ?tgWebAppStartParam=); ?d= or #d=
// opens the page outside Telegram. Format: base64url(deflate-raw(JSON)),
// version 1 (links sent before 2026-11-04) or version 2 (carry-web
// notify/share-link.mjs). Nothing is fetched or stored; values are shown as
// the record states them.
const CarryDetails = (() => {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  const DASH = '\u2014', MINUS = '\u2212';
  const ROLLBACKS = ['partial_entry_rollback', 'scale_rollback_failed'];
  const icon = {
    swap: '<svg viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
    unlink: '<svg viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 4 8"/><path d="M8 12h2"/><path d="m3 3 18 18"/></svg>',
    rewind: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
    minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    right: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
    up: '<svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>',
    down: '<svg viewBox="0 0 24 24"><path d="m7 7 10 10"/><path d="M17 7v10H7"/></svg>',
  };

  async function decode(text) {
    const bytes = Uint8Array.from(atob(text.replace(/-/g, '+').replace(/_/g, '/')), ch => ch.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(stream).text());
  }

  // Strict readers: anything malformed becomes unknown, never zero.
  const n = v => typeof v === 'number' && Number.isFinite(v) ? v : null;
  const t = v => typeof v === 'number' && Number.isFinite(v) && v > 0 ? v : null;
  const s = v => typeof v === 'string' && v ? v : null;
  const lev = v => Number.isInteger(v) && v > 0 && v <= 200 ? v : null;
  // A holding forecast beyond a year is malformed, not a forecast.
  const hrs = v => typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 8784 ? v : null;
  const price = v => typeof v === 'number' && Number.isFinite(v) && v > 0 ? v : null;
  // Entry timings beyond a day are malformed.
  const ms = v => Number.isInteger(v) && v >= 0 && v <= 86400000 ? v : null;
  const ORDERS = { m: 'Market', i: 'IOC limit', l: 'Limit', x: 'Other' };
  // Order type letter with an optional count: 'm', 'i2'.
  const order = v => {
    const m = typeof v === 'string' ? /^([milx])(\d{1,4})?$/.exec(v) : null;

    const zone = start[1] != null ? zoneName(start[1]) : 'PT';
    const netText = signed(d.net, 4), retText = signedPct(d.ret, d.retDigits);

    return '<article class="cd-window" data-event="open" data-result="' + result + '" aria-label="Open position details">'
      + '<header class="cd-hero"><div class="cd-art" aria-hidden="true"></div>'
      + '<div class="cd-brandline"><div class="cd-brand">Carry</div><div class="cd-state"><span class="cd-dot"></span><span class="cd-state-text">' + esc(status) + '</span></div></div>'
      + '<h1 class="cd-name">' + esc(pair(d.symbol)) + '</h1>'
      + '<div class="cd-position">' + (no ? '<span class="cd-number">#' + esc(no) + '</span><span aria-hidden="true">·</span>' : '') + '<span class="cd-id">' + esc(d.id ?? DASH) + '</span></div></header>'
      + '<div class="cd-body">'
      + '<div class="cd-summary"><div><div class="cd-label">Expected net</div><p class="cd-net"><strong class="cd-amount' + (d.net != null && d.net < 0 ? ' cd-negative' : d.net == null ? ' cd-unknown' : '') + wide(netText, 8) + '">' + netText + '</strong><span class="cd-currency">USDT</span></p>'
      + '<span class="cd-note">' + (d.net != null ? 'Forecast · excl. funding' : 'Not forecast') + '</span></div>'
      + '<div class="cd-return"><div class="cd-label">Expected return</div><strong class="' + tone(d.ret) + wide(retText, 8) + '">' + retText + '</strong><span>' + (d.ret != null ? 'on ' + d.retBasis : 'Not forecast') + '</span></div></div>'
      + '<div class="cd-venues" aria-label="Exchanges and position directions">' + venue('long', d.long, false)
      + '<div class="cd-bridge" aria-hidden="true">' + icon.swap + '</div>' + venue('short', d.short, true) + '</div>'
      + '<dl class="cd-overview">'
      + '<div><dt>Capital · planned</dt><dd class="' + (d.capital == null ? 'cd-unknown' : '') + '">' + money(d.capital) + (d.capital == null ? '' : ' <span class="cd-unit">USDT</span>') + '</dd></div>'
      + '<div><dt>Leverage</dt><dd class="' + (d.leverage == null ? 'cd-unknown' : '') + '">' + (d.leverage == null ? DASH : d.leverage + '×') + '</dd></div>'
      + '<div><dt>Holding · forecast</dt><dd class="' + (d.hours == null ? 'cd-unknown' : '') + '">' + esc(holding) + '</dd></div>'
      + '<div><dt>Funding · forecast</dt><dd class="' + tone(d.funding) + '">' + signed(d.funding, 4) + (d.funding == null ? '' : ' <span class="cd-unit">USDT</span>') + '</dd></div>'
      + '</dl>'
      + slipSection(d)
      + '<div class="cd-section-title"><h2>Spread execution</h2><span>Signal or target → actual fill</span></div>'
      + '<div class="cd-execution">'
      + comparison('Entry', 'Signal', d.entrySignal, d.firstLot ? 'Actual · first lot' : 'Actual', d.entryFill, true, 'Not recorded')
      + comparison('Exit', 'Target', d.exitRef, 'Actual', null, false, 'Position still open', 'Pending')
      + '</div>'
      + '<div class="cd-section-title"><h2>Position timeline</h2><span>Pacific time</span></div>'
      + '<dl class="cd-lifecycle"><div><dt>' + start[0] + '</dt>' + stamp(start[1]) + '</div><div><dt>Closed</dt><dd class="cd-unknown">Still open</dd></div></dl>'
      + '<div class="cd-close"><div><div class="cd-close-label">Status</div><p>Open at notification</p></div><div class="cd-close-mark" aria-hidden="true">' + icon.clock + '</div></div>'
      + '<div class="cd-footer"><span>Forecast frozen at entry · excludes later scale-ins</span><span>Snapshot at opening · ' + esc(zone) + '</span></div>'
      + '</div></article>';
  }

  return { decode, normalize, render, esc };
})();

(async () => {
  const tg = window.Telegram?.WebApp;
  // Inside Telegram the page follows the client's theme; elsewhere the system's.
  try { tg?.ready(); tg?.expand(); if (tg?.initData) document.documentElement.dataset.theme = tg.colorScheme; } catch {}
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
  const raw = tg?.initDataUnsafe?.start_param || params.get('tgWebAppStartParam') || params.get('d');
  if (!raw) { app.innerHTML = '<p class="empty">Open this page from a carry notification.</p>'; return; }
  try {
    app.innerHTML = CarryDetails.render(CarryDetails.normalize(await CarryDetails.decode(raw)));
  } catch (error) {
    app.innerHTML = '<p class="empty">Could not read the link: ' + CarryDetails.esc(error.message) + '</p>';
  }
})();
</script>
</body>
</html>
